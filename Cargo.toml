[package]
name = "mawakit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Prayer-time logic for mosque timetables: daily schedules, iqama rules, Jumu'a, countdowns and notification events, with a Mawaqit adapter."
readme = "README.md"
keywords = ["prayer-times", "salat", "islam", "mosque", "mawaqit"]
categories = ["date-and-time"]
# Private until the API settles and Mawaqit has agreed to the data use.
publish = false

[lib]
# rlib for Rust apps, staticlib for the Swift package, cdylib so uniffi-bindgen
# can read the exported interface from the compiled library.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
# Foreign-language bindings (Swift today; Kotlin and others later).
uniffi = ["dep:uniffi"]
# The bindings generator binary, used by `make swift`.
uniffi-cli = ["uniffi", "uniffi/cli"]

[dependencies]
jiff = "0.2.38"
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = { version = "0.32.2", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
